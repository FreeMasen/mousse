[package]
name = "mousse"
version = "0.1.1"
edition = "2018"
authors = ["Robert Masen <r.f.masen@gmail.com>"]
license = "MIT"
description = "A set of encoder and decoder for server sent events"
keywords = ["http", "sse", "server-sent", "events"]
repository = "https://github.com/FreeMasen/mousse"


[dependencies]
log = "0.4"

[dev-dependencies]
proptest = "1"
env_logger = "0.11"
warp = { version = "0.4", features = ["server", "test"] }
regex_generate = "0.2"
rand = "0.10"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
fantoccini = "0.22"
reqwest = { version = "0.13", features = ["stream"] }
serde_json = "1"
bytes = "1.11.0"
